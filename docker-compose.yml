services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: naturax
      POSTGRES_PASSWORD: naturax
      POSTGRES_DB: naturax
    ports:
      - "5432:5432"
    volumes:
      - naturax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturax -d naturax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naturax_pg:
